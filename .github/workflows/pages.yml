name: Página de mundos (GitHub Pages)

# Exporta los mundos a GLB con el mismo código que la app y publica la página de descargas.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'worlds/**'
      - 'site/**'
      - 'tools/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'worlds/**'
      - 'site/**'
      - 'tools/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Caché de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-stable-linux

      - name: Descargar Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d ~/godot

      - name: Importar proyecto
        run: |
          G=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          timeout 600 $G --headless --import || true
          timeout 600 $G --headless --import

      - name: Exportar mundos y montar la página
        run: GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 tools/build_site.sh build/site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
